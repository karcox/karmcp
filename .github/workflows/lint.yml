name: Lint

# Bloqueante, como bin/check.ps1. La primera versión de este archivo (Pieza 0,
# 2026-08-15) corría PHPCS y PHPStan con `continue-on-error`, y entonces era
# razonable: 75.000 líneas nunca analizadas, y un check rojo permanente es un
# check que se ignora. El plan que dejó escrito —triar el ruido y quitarlos—
# se completó dos días después (PHPCS a cero en la 1.16.3, lo previo de
# PHPStan congelado en phpstan-baseline.neon)… y nadie volvió a este archivo:
# el check salía verde sin poder fallar. Desde el 2026-08-23 bloquea de verdad.
#
# Regla de paridad: esto y bin/check.ps1 corren las mismas puertas. Si añades
# una allí, añádela aquí — un gate que solo corre en un lado vuelve hueco el
# verde del otro.

on:
  push:
    branches: [ karmcp, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Los archivos generados que viajan en git tienen que cuadrar con el código.
  # La suite no puede vigilar el POT (un __() nuevo simplemente nunca llega a
  # un traductor), y el --check del classmap compara además los bytes
  # renderizados, así que una edición a mano del archivo generado también cae.
  # Solo PHP, sin composer: los dos scripts son autocontenidos.
  freshness:
    name: Classmap + POT
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json
          coverage: none

      - name: Classmap al día
        run: php bin/generate-classmap.php --check

      - name: POT al día
        run: php tools/make-pot.php --check

  analyse:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json
          coverage: none
          tools: composer

      # La cadena de análisis vive en tools/ y no en el composer.json raíz: sus
      # dependencias no son del plugin y no deben tocar el lock que produce el
      # zip. Se usa `update` y no `install` porque tools/composer.lock no se
      # versiona — son herramientas, no runtime.
      - name: Cachear las herramientas
        uses: actions/cache@v4
        with:
          path: tools/vendor
          key: tools-${{ runner.os }}-${{ hashFiles('tools/composer.json') }}

      - name: Instalar la cadena de análisis
        run: composer --working-dir=tools update --no-interaction --no-progress

      - name: PHPCS
        run: tools/vendor/bin/phpcs --report=full --report-width=120

      # El mismo límite de memoria que usa bin/check.ps1: el default de PHP se
      # queda corto según crece el árbol, y un OOM aquí parecería un fallo del
      # análisis en vez de lo que es.
      - name: PHPStan
        run: tools/vendor/bin/phpstan analyse --no-progress --error-format=table --memory-limit=2G
